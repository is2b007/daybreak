<!doctype html>
<html lang="en">
  <head>
    <title>You're offline · Daybreak</title>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        background: #FDFCFA;
        color: #2B3439;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Roboto, "Segoe UI", Helvetica, Arial, sans-serif;
        line-height: 1.5;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
      }
      h1 { font-size: 1.25rem; margin-bottom: 0.5rem; }
      p { color: #5B666C; margin-bottom: 1.5rem; }
      button {
        font: inherit;
        background: #2B3439;
        color: #FDFCFA;
        border: 0;
        border-radius: 999px;
        padding: 12px 24px;
        min-height: 48px;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #121D22; color: #E6EAEC; }
        p { color: #A5AEB3; }
        button { background: #E6EAEC; color: #121D22; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Daybreak will pick up where you left off once you're back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
