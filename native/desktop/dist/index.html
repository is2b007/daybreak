<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daybreak</title>
    <style>
      :root {
        --bg: #FDFCFA;
        --ink: #2B3439;
        --muted: #5B666C;
        --line: #D9DDDF;
        --field: #FFFFFF;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #121D22; --ink: #E6EAEC; --muted: #A5AEB3; --line: #34424A; --field: #1B282E; }
      }
      * { box-sizing: border-box; margin: 0; }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 16px;
      }
      main { width: 100%; max-width: 420px; }
      h1 { font-size: 24px; line-height: 1.25; }
      p { color: var(--muted); margin-top: 8px; }
      .or { margin-top: 28px; font-size: 13px; }
      button, input { font: inherit; width: 100%; min-height: 48px; border-radius: 999px; }
      button { border: 0; background: var(--ink); color: var(--bg); font-weight: 600; cursor: pointer; margin-top: 12px; }
      button.secondary { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); }
      button:disabled { opacity: 0.6; cursor: default; }
      input { border: 1.5px solid var(--line); background: var(--field); color: var(--ink); padding: 0 20px; margin-top: 12px; }
      input:focus { outline: 2px solid var(--ink); outline-offset: 2px; }
      #hosted { margin-top: 28px; }
      #error { color: var(--ink); font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>Where's your Daybreak?</h1>
      <p>Use the hosted Daybreak, or the address of one you run yourself. You can change this later in Settings.</p>

      <button id="hosted" type="button" hidden>Daybreak hosted</button>
      <p class="or" id="or" hidden>Or use your own server</p>

      <form id="own">
        <input id="address" type="text" inputmode="url" autocomplete="url" spellcheck="false"
               placeholder="daybreak.example.com" aria-label="Server address" required>
        <p id="error" role="alert" hidden></p>
        <button id="connect" class="secondary" type="submit">Connect</button>
      </form>
    </main>

    <script>
      // The address the "Daybreak hosted" button opens. Empty hides the button.
      const HOSTED_URL = ""

      const connect = document.getElementById("connect")
      const error = document.getElementById("error")

      if (HOSTED_URL) {
        document.getElementById("hosted").hidden = false
        document.getElementById("or").hidden = false
        document.getElementById("hosted").addEventListener("click", () => use(HOSTED_URL))
      }

      document.getElementById("own").addEventListener("submit", (event) => {
        event.preventDefault()
        use(normalize(document.getElementById("address").value))
      })

      function normalize(input) {
        const trimmed = input.trim().replace(/\/+$/, "")
        return /^https?:\/\//.test(trimmed) ? trimmed : `https://${trimmed}`
      }

      async function use(url) {
        error.hidden = true
        connect.disabled = true
        connect.textContent = "Checking…"
        try {
          const response = await fetch(`${url}/native/config`)
          const config = await response.json()
          if (config.app !== "daybreak") throw new Error("not a Daybreak")
          await window.__TAURI__.core.invoke("use_server", { url })
        } catch {
          error.textContent = `Couldn't find a Daybreak at ${url}. Check the address and try again.`
          error.hidden = false
          connect.disabled = false
          connect.textContent = "Connect"
        }
      }
    </script>
  </body>
</html>
